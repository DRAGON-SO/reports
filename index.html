<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>نظام إدارة التقارير</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap">
<style>
:root{--ih:240px;--fit:cover;--ff:'Tajawal';--fw:400;--fs:1;--bg:#eef2f5;--ink:#1d3b53;--line:#8fb8b3;--ac:#2f6f63;--card:#fff;--mut:#6b7f8c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121a20;--ink:#dbe8f0;--card:#1b262e;--mut:#97a9b5}}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{line-height:1.75;margin:0;background:var(--bg);color:var(--ink);font-family:Tajawal,Tahoma,sans-serif;padding:16px}
h1{text-align:center;font-size:30px;margin:6px 0 16px;font-weight:800}
.bar{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-bottom:18px}
button{font:inherit;cursor:pointer;border-radius:12px;padding:11px 16px;border:1.5px solid var(--ink);background:var(--card);color:var(--ink);font-weight:500}
button.p{background:#58a08a;border-color:#58a08a;color:#fff}
button.d{background:#27455f;border-color:#27455f;color:#fff}
.sheet{font-family:var(--ff),Tajawal,Tahoma,sans-serif;font-weight:var(--fw);font-size:calc(16px*var(--fs));background:#fff;color:#1d3b53;max-width:900px;margin:0 auto;border-radius:16px;overflow:hidden;box-shadow:0 4px 24px rgba(0,0,0,.12);-webkit-print-color-adjust:exact;print-color-adjust:exact}
.hd{display:grid;grid-template-columns:170px 1fr 170px;align-items:center;gap:12px;padding:20px 24px;color:#1d3b53;background:linear-gradient(120deg,#ffffff,#eef6f3);box-shadow:inset 0 -6px 0 #58a08a}
.hd .lg{height:112px;display:flex;align-items:center;justify-content:center}
.hd .lg img{image-rendering:auto;height:112px;width:auto;max-width:170px;object-fit:contain;background:transparent;border-radius:0;padding:0}
.ct{text-align:center}
.ct b{font-size:1.375em;display:block;margin-bottom:8px}
.ct input{background:transparent;border:0;border-bottom:1.5px solid #8fb8b3;color:#1d3b53;text-align:center;width:90%;font:inherit;line-height:1.9;font-size:1.06em;margin:4px 0;padding:6px 4px 4px;border-radius:0}
.ct input::placeholder{color:#7f97a3}
.bd{padding:26px 24px;display:flex;flex-direction:column;gap:22px}
.row{display:grid;grid-template-columns:.8fr 1.2fr;gap:18px}
.tools{max-width:900px;margin:0 auto 14px;display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:center;background:var(--card);border-radius:14px;padding:10px 16px}
.tools select{width:auto;padding:6px 10px;border-radius:10px;background:var(--card);color:var(--ink);border-color:var(--line)}
.tools input{width:180px;padding:0;border:0}
.col{display:flex;flex-direction:column;gap:14px}
.r1{grid-template-columns:200px 1fr}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
label{display:block;font-weight:700;margin-bottom:6px;font-size:.94em}
.sheet label,.sheet h3,.sheet .ct b{font-weight:min(900,calc(var(--fw) + 300))}
.sheet input,.sheet select,.sheet textarea{font-weight:var(--fw)}
input,select,textarea{line-height:1.9;width:100%;font:inherit;color:#1d3b53;background:#fff;border:2px solid var(--line);border-radius:14px;padding:11px 14px;outline:none}
input:focus,select:focus,textarea:focus{border-color:#2f6f63}
textarea{resize:none;min-height:220px;line-height:1.7}
h3{margin:0 0 12px;text-align:center;font-size:1.19em;padding-bottom:8px;border-bottom:2px solid var(--line)}
.ev{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.eb{border:2px solid var(--line);border-radius:16px;padding:10px;display:flex;flex-direction:column;gap:8px;break-inside:avoid;page-break-inside:avoid;position:relative}
.im{height:var(--ih);border-radius:10px;display:flex;align-items:center;justify-content:center;color:#6b8a92;cursor:pointer;background:#f6faf9;overflow:hidden;text-align:center;font-size:14px}
.im{position:relative;container-type:size;cursor:grab}
.im img{position:absolute;left:50%;top:50%;max-width:none;user-select:none;-webkit-user-drag:none;pointer-events:none}
.tb{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.tb button{touch-action:manipulation;padding:5px 9px;font-size:13px;border-radius:9px;border-color:var(--line);color:#1d3b53;background:#fff}
.eb input[type=range]{padding:0;border:0;flex:1 1 100%;height:22px}
.im span{font-size:34px;display:block;line-height:1}
.eb input.cp{border-width:1.5px;padding:8px 12px;font-size:.875em}
.x{position:absolute;top:6px;left:6px;padding:2px 9px;border-radius:99px;border-color:#c66;color:#c66;background:#fff}
.sg{display:grid;grid-template-columns:1fr 1fr;gap:18px;border-top:2px solid var(--line);padding-top:18px}
.add{align-self:center}
#ar{max-width:900px;margin:0 auto 18px;background:var(--card);border-radius:16px;padding:16px;display:none}
#ar.on{display:block}
.it{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.it div{flex:1}.it small{color:var(--mut)}
.it button{padding:7px 12px}
#t{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:#27455f;color:#fff;padding:10px 20px;border-radius:99px;display:none;z-index:9}
@media(max-width:640px){.hd{grid-template-columns:100px 1fr 100px;padding:14px}.hd .lg,.hd .lg img{height:68px;max-width:100px}.row,.r1,.ev,.sg{grid-template-columns:1fr}.ct b{font-size:1em}.ct input{font-size:.875em}}
@media print{
 @page{size:A4;margin:7mm}
 html,body{background:#fff;padding:0;margin:0}
 .tb,.bar,.tools,#ar,h1,#t,.x,.add{display:none!important}
 .sheet{box-shadow:none;border-radius:0;max-width:none;overflow:visible}
 .hd{padding:12px 18px;gap:10px}
 .hd .lg,.hd .lg img{height:90px}
 .ct b{font-size:1.19em;margin-bottom:4px}
 .ct input{font-size:.94em;line-height:1.7;margin:2px 0;padding:3px 4px}
 .bd{padding:14px 18px;gap:12px}
 .row{gap:14px}.col{gap:9px}.two{gap:10px}
 label{margin-bottom:3px;font-size:.875em}
 input,select,textarea{padding:5px 11px;line-height:1.9;border-radius:11px}
 textarea{min-height:0;overflow:hidden}
 h3{margin-bottom:8px;padding-bottom:5px;font-size:1.06em}
 .ev{gap:12px}
 .eb{padding:7px;gap:6px}
 .im{height:calc(var(--ih)*.58)}
 .eb input.cp{padding:5px 10px}
 .sg{gap:14px;padding-top:10px}
 .ct input{border:0;border-bottom:1.5px solid #8fb8b3}
 .im:not(:has(img)){visibility:hidden}
 .eb input.cp:placeholder-shown{display:none}
 .eb input.cp:not(:placeholder-shown){border:0;padding:2px 6px;text-align:center}
 select{appearance:none}
}
</style>
</head>
<body>
<h1>نظام إدارة التقارير</h1>
<div class="bar">
 <button class="p" id="sv">حفظ في الأرشيف</button>
 <button id="ao">أرشيف التقارير</button>
 <button id="nw">تقرير جديد</button>
 <button id="lc">حفظ محلي</button>
 <button id="im">فتح ملف محفوظ</button>
 <button class="d" id="pd">تصدير PDF</button>
 <input type="file" id="fi" accept=".json" hidden>
</div>
<div class="tools">
 <label style="margin:0">حجم مربعات الصور</label><input type="range" id="ih" min="100" max="420" step="10" value="240">
 <label style="margin:0">نوع الخط</label><select id="ff"><option value="Tajawal">تجوّل</option><option value="Cairo">القاهرة</option><option value="Almarai">المراعي</option><option value="Amiri">أميري</option><option value="Noto Naskh Arabic">نسخ</option><option value="Noto Kufi Arabic">كوفي</option><option value="Reem Kufi">ريم كوفي</option><option value="El Messiri">المسيري</option><option value="Changa">شنغا</option><option value="IBM Plex Sans Arabic">IBM Plex</option></select>
 <label style="margin:0">سمك الخط</label><input type="range" id="fw" min="300" max="800" step="100" value="400">
 <label style="margin:0">حجم الخط</label><input type="range" id="fs" min="80" max="130" step="5" value="100">
 <label style="margin:0">عرض الصورة</label><select id="ft"><option value="cover">ملء الإطار</option><option value="contain">الصورة كاملة</option></select>
</div>
<div id="ar"><h3>الأرشيف</h3><div id="al"></div></div>

const fields=()=>[...document.querySelectorAll('[data-k]')];
const grow=()=>{const a=$('[data-k=tasks]');a.style.height='auto';a.style.height=Math.max(220,a.scrollHeight)+'px'};
$('[data-k=tasks]').addEventListener('input',grow);
const CQ=!!(window.CSS&&CSS.supports&&CSS.supports('width','1cqw'));
const rot=(i,e)=>{if(!i)return;const r=((e.r||0)%360+360)%360,q=r%180,im=i.parentNode,ar=(i.naturalWidth&&i.naturalHeight)?i.naturalWidth/i.naturalHeight:(e.ar||1.5),f=$('#ft').value=='cover'?'max':'min';
 let we,he,u='cqw',v='cqh',x=e.x||0,y=e.y||0;
 if(CQ){const a=q?`${f}(100cqh,100cqw*${ar})`:`${f}(100cqw,100cqh*${ar})`;we=`calc(${a})`;he=`calc(${a}/${ar})`}
 else{const W=im.clientWidth,H=im.clientHeight,w=q?Math[f](H,W*ar):Math[f](W,H*ar);we=w+'px';he=(w/ar)+'px';u=v='px';x=x*W/100;y=y*H/100}
 i.style.width=we;i.style.height=he;
 i.style.transform=`translate(calc(-50% + ${x}${u}),calc(-50% + ${y}${v})) rotate(${r}deg) scale(${e.z||1})`};
function pick(e){const f=document.createElement('input');f.type='file';f.accept='image/*';f.onchange=()=>{const r=new FileReader();r.onload=()=>{e.img=r.result;e.z=1;e.x=0;e.y=0;e.r=0;renderEv()};r.readAsDataURL(f.files[0])};f.click()}
function renderEv(){const w=$('#ev');w.innerHTML='';ev.forEach((e,i)=>{const b=document.createElement('div');b.className='eb';
 b.innerHTML=`<button class="x" title="حذف">×</button><div class="im">${e.img?`<img src="${e.img}">`:`<div><span>+</span>إضافة صورة ${i+1}</div>`}</div>${e.img?`<div class="tb"><input type="range" min="30" max="400" value="${Math.round((e.z||1)*100)}" title="الحجم"><button data-a="u">↑</button><button data-a="d">↓</button><button data-a="l">←</button><button data-a="r">→</button><button data-a="rot">تدوير</button><button data-a="rs">ضبط</button><button data-a="ch">تغيير</button></div>`:''}<input class="cp" placeholder="وصف الشاهد (اختياري)">`;
 const inp=b.querySelector('.cp'),im=b.querySelector('.im'),tb=b.querySelector('.tb');inp.value=e.cap||'';inp.oninput=()=>e.cap=inp.value;
 b.querySelector('.x').onclick=()=>{ev.splice(i,1);renderEv()};
 {const g=im.querySelector('img');if(g){g.onload=()=>{e.ar=g.naturalWidth/g.naturalHeight;rot(g,e)};rot(g,e)}}
 if(!e.img)im.onclick=()=>pick(e);
 else{
  const sl=tb.querySelector('input');sl.oninput=()=>{e.z=sl.value/100;rot(im.querySelector('img'),e)};
  tb.onclick=k=>{const a=k.target.dataset.a;if(!a)return;const S=5;
   if(a=='ch')return pick(e);
   if(a=='u')e.y=(e.y||0)-S;if(a=='d')e.y=(e.y||0)+S;if(a=='l')e.x=(e.x||0)-S;if(a=='r')e.x=(e.x||0)+S;
   if(a=='rot')e.r=((e.r||0)+90)%360;
   if(a=='rs'){e.z=1;e.x=0;e.y=0;e.r=0;sl.value=100}
   rot(im.querySelector('img'),e)};
  im.onpointerdown=p=>{if(p.pointerType=='touch')return;const R=im.getBoundingClientRect();let sx=p.clientX,sy=p.clientY;im.setPointerCapture(p.pointerId);
   im.onpointermove=m=>{e.x=(e.x||0)+(m.clientX-sx)/R.width*100;e.y=(e.y||0)+(m.clientY-sy)/R.height*100;sx=m.clientX;sy=m.clientY;rot(im.querySelector('img'),e)};
   im.onpointerup=()=>{im.onpointermove=null}}
 }
 w.appendChild(b)})}
const FS={'Tajawal':'Tajawal:wght@200;300;400;500;700;800;900','Cairo':'Cairo:wght@200..1000','Almarai':'Almarai:wght@300;400;700;800','Amiri':'Amiri:wght@400;700','Noto Naskh Arabic':'Noto+Naskh+Arabic:wght@400..700','Noto Kufi Arabic':'Noto+Kufi+Arabic:wght@100..900','Reem Kufi':'Reem+Kufi:wght@400..700','El Messiri':'El+Messiri:wght@400..700','Changa':'Changa:wght@200..800','IBM Plex Sans Arabic':'IBM+Plex+Sans+Arabic:wght@100;200;300;400;500;600;700'},LF={};
const fnt=()=>{const n=$('#ff').value,r=document.documentElement.style;if(FS[n]&&!LF[n]&&n!='Tajawal'){LF[n]=1;const l=document.createElement('link');l.rel='stylesheet';l.href='https://fonts.googleapis.com/css2?family='+FS[n]+'&display=swap';document.head.appendChild(l)}
 r.setProperty('--ff',"'"+n+"'");r.setProperty('--fw',$('#fw').value);r.setProperty('--fs',$('#fs').value/100)};
$('#ff').onchange=$('#fw').oninput=$('#fs').oninput=fnt;
const sz=()=>{const r=document.documentElement.style;r.setProperty('--ih',$('#ih').value+'px');r.setProperty('--fit',$('#ft').value)};
$('#ih').oninput=sz;$('#ft').onchange=()=>{sz();renderEv()};
const get=()=>{const d={id:cur||('r'+Date.now()),saved:Date.now(),ev,ih:$('#ih').value,fit:$('#ft').value,ff:$('#ff').value,fw:$('#fw').value,fs:$('#fs').value};fields().forEach(f=>d[f.dataset.k]=f.value);return d};
const set=d=>{if(d.type=='اسم التقرير')d.type='تقرير';cur=d.id;fields().forEach(f=>f.value=d[f.dataset.k]||(f.tagName=='SELECT'?f.options[0].value:''));ev=d.ev&&d.ev.length?d.ev:[{},{},{},{}];if(d.ff)$('#ff').value=d.ff;if(d.fw)$('#fw').value=d.fw;if(d.fs)$('#fs').value=d.fs;fnt();$('#ih').value=d.ih||240;$('#ft').value=d.fit||'cover';sz();renderEv();grow();tl()};
const tl=()=>{const v=$('[data-k=type]').value;$('#nl').textContent=v=='تقرير'?'اسم التقرير':'اسم '+v;$('[data-k=name]').placeholder='اكتب '+$('#nl').textContent};
$('[data-k=type]').onchange=tl;
$('#ae').onclick=()=>{ev.push({});renderEv()};
$('#nw').onclick=()=>{if(confirm('بدء تقرير جديد؟ التغييرات غير المحفوظة ستُفقد.')){cur=null;set({})}};
$('#sv').onclick=async()=>{const d=get();cur=d.id;try{await tx('readwrite',s=>s.put(d));T('تم الحفظ في الأرشيف')}catch(e){T('تعذّر الحفظ في هذا المتصفح')}};
async function list(){const l=$('#al');let a=[];try{a=await tx('readonly',s=>s.getAll())}catch(e){}
 a.sort((x,y)=>y.saved-x.saved);l.innerHTML=a.length?'':'<p style="text-align:center;color:var(--mut)">لا توجد تقارير محفوظة. اكتب تقريرًا واضغط «حفظ في الأرشيف».</p>';
 a.forEach(d=>{const r=document.createElement('div');r.className='it';r.innerHTML=`<div><b></b><br><small>${new Date(d.saved).toLocaleString('ar-SA')}</small></div><button>فتح وتعديل</button><button style="color:#c66;border-color:#c66">حذف</button>`;
  r.querySelector('b').textContent=d.name||'تقرير بدون عنوان';
  const [o,x]=r.querySelectorAll('button');
  o.onclick=()=>{set(d);$('#ar').classList.remove('on');window.scrollTo(0,0)};
  x.onclick=async()=>{if(confirm('حذف هذا التقرير؟')){await tx('readwrite',s=>s.delete(d.id));if(cur==d.id)cur=null;list()}};
  l.appendChild(r)})}
$('#ao').onclick=()=>{$('#ar').classList.toggle('on');list()};
$('#lc').onclick=()=>{const d=get(),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(d)],{type:'application/json'}));a.download=(d.name||'تقرير')+'.json';a.click();T('تم حفظ الملف على جهازك')};
$('#im').onclick=()=>$('#fi').click();
$('#fi').onchange=e=>{const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);d.id=null;set(d);cur=null;T('تم فتح الملف')}catch(x){T('الملف غير صالح')}};r.readAsText(e.target.files[0]);e.target.value=''};
$('#pd').onclick=()=>{const o=document.title;document.title=$('[data-k=name]').value||'تقرير';window.print();setTimeout(()=>document.title=o,1000)};
set({});
</script>
