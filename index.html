<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>نظام إدارة التقارير</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap">
<style>
:root{--bg:#eef2f5;--ink:#1d3b53;--line:#8fb8b3;--ac:#2f6f63;--card:#fff;--mut:#6b7f8c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121a20;--ink:#dbe8f0;--card:#1b262e;--mut:#97a9b5}}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Tajawal,Tahoma,sans-serif;padding:16px}
h1{text-align:center;font-size:30px;margin:6px 0 16px;font-weight:800}
.bar{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-bottom:18px}
button{font:inherit;cursor:pointer;border-radius:12px;padding:11px 16px;border:1.5px solid var(--ink);background:var(--card);color:var(--ink);font-weight:500}
button.p{background:#58a08a;border-color:#58a08a;color:#fff}
button.d{background:#27455f;border-color:#27455f;color:#fff}
.sheet{background:#fff;color:#1d3b53;max-width:900px;margin:0 auto;border-radius:16px;overflow:hidden;box-shadow:0 4px 24px rgba(0,0,0,.12);-webkit-print-color-adjust:exact;print-color-adjust:exact}
.hd{display:grid;grid-template-columns:150px 1fr 150px;align-items:center;gap:12px;padding:20px 24px;color:#fff;background:linear-gradient(120deg,#27455f,#58a08a)}
.hd .lg{height:96px;display:flex;align-items:center;justify-content:center}
.hd .lg img{height:96px;width:auto;max-width:150px;object-fit:contain;background:#fff;border-radius:10px;padding:6px}
.ct{text-align:center}
.ct b{font-size:22px;display:block;margin-bottom:8px}
.ct input{background:transparent;border:0;border-bottom:1px solid rgba(255,255,255,.7);color:#fff;text-align:center;width:90%;font:inherit;font-size:17px;margin:4px 0;padding:4px;border-radius:0}
.ct input::placeholder{color:rgba(255,255,255,.7)}
.bd{padding:26px 24px;display:flex;flex-direction:column;gap:22px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.col{display:flex;flex-direction:column;gap:14px}
.r1{grid-template-columns:200px 1fr}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
label{display:block;font-weight:700;margin-bottom:6px;font-size:15px}
input,select,textarea{width:100%;font:inherit;color:#1d3b53;background:#fff;border:2px solid var(--line);border-radius:14px;padding:11px 14px;outline:none}
input:focus,select:focus,textarea:focus{border-color:#2f6f63}
textarea{resize:none;min-height:220px;line-height:1.7}
h3{margin:0 0 12px;text-align:center;font-size:19px;padding-bottom:8px;border-bottom:2px solid var(--line)}
.ev{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.eb{border:2px solid var(--line);border-radius:16px;padding:10px;display:flex;flex-direction:column;gap:8px;break-inside:avoid;page-break-inside:avoid;position:relative}
.im{height:240px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#6b8a92;cursor:pointer;background:#f6faf9;overflow:hidden;text-align:center;font-size:14px}
.im img{width:100%;height:100%;object-fit:contain}
.im span{font-size:34px;display:block;line-height:1}
.eb input{border-width:1.5px;padding:8px 12px;font-size:14px}
.x{position:absolute;top:6px;left:6px;padding:2px 9px;border-radius:99px;border-color:#c66;color:#c66;background:#fff}
.sg{display:grid;grid-template-columns:1fr 1fr;gap:18px;border-top:2px solid var(--line);padding-top:18px}
.add{align-self:center}
#ar{max-width:900px;margin:0 auto 18px;background:var(--card);border-radius:16px;padding:16px;display:none}
#ar.on{display:block}
.it{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.it div{flex:1}.it small{color:var(--mut)}
.it button{padding:7px 12px}
#t{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:#27455f;color:#fff;padding:10px 20px;border-radius:99px;display:none;z-index:9}
@media(max-width:640px){.hd{grid-template-columns:90px 1fr 90px;padding:14px}.hd .lg,.hd .lg img{height:60px;max-width:90px}.row,.r1,.ev,.sg{grid-template-columns:1fr}.ct b{font-size:16px}.ct input{font-size:14px}}
@media print{
 @page{size:A4;margin:8mm}
 body{background:#fff;padding:0}
 .bar,#ar,h1,#t,.x,.add{display:none!important}
 .sheet{box-shadow:none;border-radius:0;max-width:none}
 .ct input,input,select,textarea{border-color:#8fb8b3}
 .ct input{border:0;border-bottom:1px solid #fff}
 .im:not(:has(img)){visibility:hidden}
 select{appearance:none}
}
</style>
</head>
<body>
<h1>نظام إدارة التقارير</h1>
<div class="bar">
 <button class="p" id="sv">حفظ في الأرشيف</button>

 <button id="lc">حفظ محلي</button>
 <button id="im">فتح ملف محفوظ</button>
 <button class="d" id="pd">تصدير PDF</button>
 <input type="file" id="fi" accept=".json" hidden>
</div>

 <div class="bd">
  <div class="row r1">
   <div><label>نوع النشاط</label><select data-k="type"><option>اسم التقرير</option><option>برنامج</option><option>مبادرة</option><option>ورشة عمل</option><option>دورة تدريبية</option><option>فعالية</option><option>زيارة</option></select></div>
   <div><label id="nl">اسم التقرير</label><input data-k="name" placeholder="اكتب اسم التقرير"></div>
  </div>
  <div class="row">
   <div class="col">
    <div><label>اسم المنفذ:</label><input data-k="exec"></div>
    <div><label>المستفيدون:</label><input data-k="ben"></div>
    <div class="two"><div><label>عدد المستفيدين:</label><input data-k="cnt"></div><div><label>مدة التنفيذ:</label><input data-k="dur"></div></div>
    <div><label>تاريخ التنفيذ:</label><input data-k="date"></div>
   </div>
   <div style="display:flex;flex-direction:column"><label>المهام المنجزة</label><textarea data-k="tasks" placeholder="اضغط للبدء بالكتابة..." style="flex:1"></textarea></div>
  </div>
  <div><h3>شواهد</h3><div class="ev" id="ev"></div><div style="text-align:center;margin-top:16px"><button class="add" id="ae">+ إضافة شاهد</button></div></div>
  <div class="sg">
   <div><label>اسم معد/ة التقرير</label><input data-k="prep"></div>
   <div><label>اسم المدير/ة المباشر</label><input data-k="mgr"></div>
  </div>
 </div>
</div>
<div id="t"></div>
<script>
const $=s=>document.querySelector(s);
const T=(m)=>{const t=$('#t');t.textContent=m;t.style.display='block';clearTimeout(T.h);T.h=setTimeout(()=>t.style.display='none',2200)};
// IndexedDB
const openDB=()=>new Promise((ok,no)=>{try{const q=indexedDB.open('reports',1);q.onupgradeneeded=()=>q.result.createObjectStore('r',{keyPath:'id'});q.onsuccess=()=>ok(q.result);q.onerror=()=>no(q.error)}catch(e){no(e)}});
const tx=async(m,f)=>{const d=await openDB();return new Promise((ok,no)=>{const t=d.transaction('r',m),r=f(t.objectStore('r'));t.oncomplete=()=>ok(r.result);t.onerror=()=>no(t.error)})};
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
let cur=null,ev=[{},{},{},{}];
const fields=()=>[...document.querySelectorAll('[data-k]')];
const grow=()=>{const a=$('[data-k=tasks]');a.style.height='auto';a.style.height=Math.max(220,a.scrollHeight)+'px'};
$('[data-k=tasks]').addEventListener('input',grow);
function renderEv(){const w=$('#ev');w.innerHTML='';ev.forEach((e,i)=>{const b=document.createElement('div');b.className='eb';
 b.innerHTML=`<button class="x" title="حذف">×</button><div class="im">${e.img?`<img src="${e.img}">`:`<div><span>+</span>إضافة صورة ${i+1}</div>`}</div><input placeholder="وصف الشاهد (اختياري)" value="">`;
 const inp=b.querySelector('input');inp.value=e.cap||'';inp.oninput=()=>e.cap=inp.value;
 b.querySelector('.x').onclick=()=>{ev.splice(i,1);renderEv()};
 b.querySelector('.im').onclick=()=>{const f=document.createElement('input');f.type='file';f.accept='image/*';f.onchange=()=>{const r=new FileReader();r.onload=()=>{e.img=r.result;renderEv()};r.readAsDataURL(f.files[0])};f.click()};
 w.appendChild(b)})}
const get=()=>{const d={id:cur||('r'+Date.now()),saved:Date.now(),ev};fields().forEach(f=>d[f.dataset.k]=f.value);return d};
const set=d=>{cur=d.id;fields().forEach(f=>f.value=d[f.dataset.k]||(f.tagName=='SELECT'?f.options[0].value:''));ev=d.ev&&d.ev.length?d.ev:[{},{},{},{}];renderEv();grow();tl()};
const tl=()=>{const v=$('[data-k=type]').value;$('#nl').textContent=v=='اسم التقرير'?v:'اسم '+v;$('[data-k=name]').placeholder='اكتب '+$('#nl').textContent};
$('[data-k=type]').onchange=tl;
$('#ae').onclick=()=>{ev.push({});renderEv()};
$('#nw').onclick=()=>{if(confirm('بدء تقرير جديد؟ التغييرات غير المحفوظة ستُفقد.')){cur=null;set({})}};
$('#sv').onclick=async()=>{const d=get();cur=d.id;try{await tx('readwrite',s=>s.put(d));T('تم الحفظ في الأرشيف')}catch(e){T('تعذّر الحفظ في هذا المتصفح')}};
async function list(){const l=$('#al');let a=[];try{a=await tx('readonly',s=>s.getAll())}catch(e){}
 a.sort((x,y)=>y.saved-x.saved);l.innerHTML=a.length?'':'<p style="text-align:center;color:var(--mut)">لا توجد تقارير محفوظة. اكتب تقريرًا واضغط «حفظ في الأرشيف».</p>';
 a.forEach(d=>{const r=document.createElement('div');r.className='it';r.innerHTML=`<div><b></b><br><small>${new Date(d.saved).toLocaleString('ar-SA')}</small></div><button>فتح وتعديل</button><button style="color:#c66;border-color:#c66">حذف</button>`;
  r.querySelector('b').textContent=d.name||'تقرير بدون عنوان';
  const [o,x]=r.querySelectorAll('button');
  o.onclick=()=>{set(d);$('#ar').classList.remove('on');window.scrollTo(0,0)};
  x.onclick=async()=>{if(confirm('حذف هذا التقرير؟')){await tx('readwrite',s=>s.delete(d.id));if(cur==d.id)cur=null;list()}};
  l.appendChild(r)})}
$('#ao').onclick=()=>{$('#ar').classList.toggle('on');list()};
$('#lc').onclick=()=>{const d=get(),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(d)],{type:'application/json'}));a.download=(d.name||'تقرير')+'.json';a.click();T('تم حفظ الملف على جهازك')};
$('#im').onclick=()=>$('#fi').click();
$('#fi').onchange=e=>{const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);d.id=null;set(d);cur=null;T('تم فتح الملف')}catch(x){T('الملف غير صالح')}};r.readAsText(e.target.files[0]);e.target.value=''};
$('#pd').onclick=()=>{const o=document.title;document.title=$('[data-k=name]').value||'تقرير';window.print();setTimeout(()=>document.title=o,1000)};
set({});
</script>
</body>
</html>
